<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAR-Enabled · EventMaker</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f172a;
    --panel: #172033;
    --borde: #26344d;
    --texto: #f8fafc;
    --texto-sutil: #94a3b8;
    --acento: #22c55e;
    --acento-hover: #4ade80;
    --ambar: #f59e0b;
    --error: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--texto);
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    margin: 0;
    padding: 32px 20px 64px;
  }
  main { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .subtitulo { color: var(--texto-sutil); margin: 0 0 28px; }
  section {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  h2 { font-size: 1.05rem; margin: 0 0 14px; }
  label { display: block; font-size: .85rem; color: var(--texto-sutil); margin: 10px 0 4px; }
  input, select, button {
    font-family: inherit;
    font-size: .95rem;
    border-radius: 8px;
    border: 1px solid var(--borde);
    background: #0f1626;
    color: var(--texto);
    padding: 9px 11px;
  }
  input, select { width: 100%; }
  .fila { display: flex; gap: 12px; flex-wrap: wrap; }
  .fila > div { flex: 1; min-width: 160px; }
  .selector-equipo { position: relative; }
  .selector-equipo > button {
    align-items: center; background: #0f1626; border: 1px solid var(--borde); color: var(--texto);
    display: flex; font-weight: 400; gap: 9px; justify-content: flex-start; margin: 0;
    min-height: 40px; padding: 7px 11px; text-align: left; width: 100%;
  }
  .selector-equipo > button::after { color: var(--texto-sutil); content: '⌄'; font-size: 1.1rem; margin-left: auto; }
  .selector-equipo > button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .escudo-equipo { height: 28px; object-fit: contain; width: 28px; }
  .escudo-equipo.mini { height: 22px; width: 22px; }
  .selector-placeholder { color: var(--texto-sutil); }
  .opciones-equipo {
    background: #111c31; border: 1px solid #3b4c6c; border-radius: 10px; box-shadow: 0 14px 30px #020617aa;
    display: grid; gap: 2px; left: 0; max-height: 260px; overflow-y: auto; padding: 5px;
    position: absolute; right: 0; top: calc(100% + 5px); z-index: 10;
  }
  .opcion-equipo {
    align-items: center; background: transparent; color: var(--texto); display: flex; font-weight: 400;
    gap: 9px; justify-content: flex-start; margin: 0; padding: 7px 8px; text-align: left; width: 100%;
  }
  .opcion-equipo:hover, .opcion-equipo:focus-visible { background: #21314f; }
  .opcion-equipo:disabled { color: var(--texto-sutil); opacity: .5; }
  button {
    background: var(--acento);
    border: 0;
    color: #052e16;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
    padding: 10px 16px;
  }
  button:hover { background: var(--acento-hover); }
  button:disabled { cursor: not-allowed; opacity: .45; }
  .lista-partidos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    align-items: center;
    border: 1px solid var(--borde);
    border-radius: 999px;
    display: inline-flex;
    gap: 6px;
    padding: 6px 12px;
    font-size: .85rem;
    cursor: pointer;
  }
  .chip.activo { border-color: var(--acento); color: var(--acento); }
  .chip small { color: var(--texto-sutil); margin-left: 6px; }
  .reloj {
    align-items: center;
    background: #0f1626;
    border: 1px solid var(--borde);
    border-radius: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: space-between;
    margin-top: 14px;
    padding: 12px 16px;
  }
  .reloj .minuto { font-size: 2rem; font-variant-numeric: tabular-nums; font-weight: 800; }
  .reloj .estado { color: var(--texto-sutil); }
  .reloj button { margin-top: 0; }
  .aviso {
    border: 1px solid var(--ambar);
    border-radius: 10px;
    color: #fcd34d;
    margin: 0 0 12px;
    padding: 10px 14px;
  }
  .ayuda { color: var(--texto-sutil); font-size: .85rem; margin: 8px 0 0; }
  #log {
    font-family: ui-monospace, Consolas, monospace;
    font-size: .82rem;
    max-height: 320px;
    overflow-y: auto;
  }
  #log div { padding: 6px 0; border-bottom: 1px solid var(--borde); }
  #log .ok { color: var(--acento); }
  #log .err { color: var(--error); }
  .oculto { display: none !important; }
  .enfrentamiento-resumen { align-items: center; display: inline-flex; gap: 5px; }
  .enfrentamiento-resumen .vs { color: var(--texto-sutil); font-size: .75rem; }
  .reloj .estado .enfrentamiento-resumen { font-size: .95rem; margin-bottom: 2px; }
  @media (max-width: 560px) { .opciones-equipo { max-height: 210px; } }
</style>
</head>
<body>
<main>
  <h1>VAR-Enabled · EventMaker</h1>
  <p class="subtitulo">Crea partidos, inícialos y dispara eventos en vivo contra la API de <code>live_feed_producer</code>. El minuto lo pone el reloj del partido, no se escribe a mano.</p>

  <section>
    <label for="apiBase">URL de la API</label>
    <input id="apiBase" value="http://localhost:8082">
  </section>

  <section>
    <h2>1. Crear partido</h2>
    <div class="fila">
      <div>
        <label for="nuevoMatchId">ID del partido</label>
        <input id="nuevoMatchId" placeholder="ej. final-copa">
      </div>
      <div>
        <label for="equipoLocal">Equipo local</label>
        <input id="equipoLocal" type="hidden">
        <div class="selector-equipo" data-input="equipoLocal">
          <button id="selectorEquipoLocal" type="button" aria-expanded="false" aria-haspopup="listbox">
            <span class="selector-placeholder">Selecciona un equipo</span>
          </button>
          <div id="opcionesEquipoLocal" class="opciones-equipo oculto" role="listbox" aria-label="Equipo local"></div>
        </div>
      </div>
      <div>
        <label for="equipoVisitante">Equipo visitante</label>
        <input id="equipoVisitante" type="hidden">
        <div class="selector-equipo" data-input="equipoVisitante">
          <button id="selectorEquipoVisitante" type="button" aria-expanded="false" aria-haspopup="listbox">
            <span class="selector-placeholder">Selecciona un equipo</span>
          </button>
          <div id="opcionesEquipoVisitante" class="opciones-equipo oculto" role="listbox" aria-label="Equipo visitante"></div>
        </div>
      </div>
    </div>
    <button id="btnCrearPartido">Crear partido</button>

    <label style="margin-top:18px">Partidos creados (clic para seleccionar)</label>
    <div id="listaPartidos" class="lista-partidos"></div>

    <div class="reloj">
      <div>
        <div class="minuto" id="relojMinuto">--</div>
        <div class="estado" id="relojEstado">Seleccioná un partido</div>
      </div>
      <div>
        <button id="btnIniciarPartido" class="oculto">Iniciar partido</button>
        <button id="btnSegundoTiempo" class="oculto">Iniciar segundo tiempo</button>
      </div>
    </div>
  </section>

  <section>
    <h2>2. Disparar evento</h2>
    <p id="avisoRevision" class="aviso oculto"></p>
    <div class="fila">
      <div>
        <label for="tipoEvento">Tipo de evento</label>
        <select id="tipoEvento"></select>
      </div>
      <div id="campoEquipo">
        <label for="equipo">Equipo</label>
        <select id="equipo">
          <option value="home">Local</option>
          <option value="away">Visitante</option>
        </select>
      </div>
      <div id="campoRevisar" class="oculto">
        <label for="jugadaARevisar">Jugada a revisar (últimos 2 minutos)</label>
        <select id="jugadaARevisar"></select>
      </div>
      <div id="campoMinutosAgregados" class="oculto">
        <label for="minutosAgregados">Minutos a agregar (1-10)</label>
        <input id="minutosAgregados" type="number" min="1" max="10" value="3">
      </div>
    </div>
    <p id="ayudaEvento" class="ayuda"></p>
    <button id="btnEnviarEvento" disabled>Enviar evento</button>
  </section>

  <section>
    <h2>Actividad</h2>
    <div id="log"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let partidoSeleccionado = null;
let partidosConocidos = [];
let eventosDelPartido = [];
let estadoAnterior = null;

// Datos de presentación del catálogo Premier League. El EventMaker no consulta ni modifica datos de equipos.
const EQUIPOS_PREMIER = [
  ['Arsenal', 'arsenal'], ['Aston Villa', 'aston-villa'], ['Bournemouth', 'bournemouth'],
  ['Brentford', 'brentford'], ['Brighton', 'brighton'], ['Chelsea', 'chelsea'],
  ['Coventry City', 'coventry-city'], ['Crystal Palace', 'crystal-palace'], ['Everton', 'everton'],
  ['Fulham', 'fulham'], ['Hull City', 'hull-city'], ['Ipswich Town', 'ipswich-town'],
  ['Leeds United', 'leeds-united'], ['Liverpool', 'liverpool'], ['Manchester City', 'manchester-city'],
  ['Manchester United', 'manchester-united'], ['Newcastle United', 'newcastle-united'],
  ['Nottingham Forest', 'nottingham-forest'], ['Sunderland', 'sunderland'], ['Tottenham Hotspur', 'tottenham'],
];
const EQUIPO_POR_NOMBRE = Object.fromEntries(EQUIPOS_PREMIER);

function rutaEscudo(nombre) {
  const slug = EQUIPO_POR_NOMBRE[nombre];
  if (!slug) return null;
  // Permite abrir este HTML directamente y también servirlo junto al frontend compilado.
  return location.protocol === 'file:'
    ? `../frontend/public/assets/equipos/${slug}.svg`
    : `/assets/equipos/${slug}.svg`;
}

function nodoEquipo(nombre, clase = '') {
  const grupo = document.createElement('span');
  grupo.className = clase;
  const escudo = rutaEscudo(nombre);
  if (escudo) {
    const imagen = document.createElement('img');
    imagen.className = 'escudo-equipo mini';
    imagen.src = escudo;
    imagen.alt = '';
    grupo.appendChild(imagen);
  }
  const texto = document.createElement('span');
  texto.textContent = nombre;
  grupo.appendChild(texto);
  return grupo;
}

function crearSelectorEquipo(inputId, botonId, opcionesId) {
  const entrada = $(inputId);
  const boton = $(botonId);
  const opciones = $(opcionesId);

  function cerrar() {
    opciones.classList.add('oculto');
    boton.setAttribute('aria-expanded', 'false');
  }
  function pintarBoton() {
    boton.replaceChildren();
    if (!entrada.value) {
      const placeholder = document.createElement('span');
      placeholder.className = 'selector-placeholder';
      placeholder.textContent = 'Selecciona un equipo';
      boton.appendChild(placeholder);
      return;
    }
    const escudo = rutaEscudo(entrada.value);
    if (escudo) {
      const imagen = document.createElement('img');
      imagen.className = 'escudo-equipo';
      imagen.src = escudo;
      imagen.alt = '';
      boton.appendChild(imagen);
    }
    boton.append(document.createTextNode(entrada.value));
  }
  function pintarOpciones() {
    opciones.replaceChildren();
    EQUIPOS_PREMIER.forEach(([nombre]) => {
      const opcion = document.createElement('button');
      opcion.type = 'button';
      opcion.className = 'opcion-equipo';
      opcion.setAttribute('role', 'option');
      opcion.setAttribute('aria-selected', String(entrada.value === nombre));
      // Un mismo club no puede ser local y visitante en el mismo partido.
      const otroInput = inputId === 'equipoLocal' ? $('equipoVisitante') : $('equipoLocal');
      opcion.disabled = otroInput.value === nombre;
      const escudo = rutaEscudo(nombre);
      const imagen = document.createElement('img');
      imagen.className = 'escudo-equipo';
      imagen.src = escudo;
      imagen.alt = '';
      opcion.append(imagen, document.createTextNode(nombre));
      opcion.onclick = () => {
        entrada.value = nombre;
        pintarBoton();
        actualizarSelectoresEquipos();
        cerrar();
      };
      opciones.appendChild(opcion);
    });
  }
  boton.onclick = () => {
    const abrir = opciones.classList.contains('oculto');
    document.querySelectorAll('.opciones-equipo').forEach((lista) => lista.classList.add('oculto'));
    document.querySelectorAll('.selector-equipo > button').forEach((control) => control.setAttribute('aria-expanded', 'false'));
    if (abrir) {
      pintarOpciones();
      opciones.classList.remove('oculto');
      boton.setAttribute('aria-expanded', 'true');
    }
  };
  return { pintarBoton, pintarOpciones };
}

const selectoresEquipos = [
  crearSelectorEquipo('equipoLocal', 'selectorEquipoLocal', 'opcionesEquipoLocal'),
  crearSelectorEquipo('equipoVisitante', 'selectorEquipoVisitante', 'opcionesEquipoVisitante'),
];
function actualizarSelectoresEquipos() {
  selectoresEquipos.forEach((selector) => { selector.pintarBoton(); selector.pintarOpciones(); });
}
document.addEventListener('click', (evento) => {
  if (!evento.target.closest('.selector-equipo')) {
    document.querySelectorAll('.opciones-equipo').forEach((lista) => lista.classList.add('oculto'));
    document.querySelectorAll('.selector-equipo > button').forEach((control) => control.setAttribute('aria-expanded', 'false'));
  }
});

const NOMBRE_ESTADO = {
  POR_JUGAR: 'Por jugar', EN_JUEGO: 'En juego', EN_REVISION: 'Revisión VAR',
  ENTRETIEMPO: 'Entretiempo', FINALIZADO: 'Finalizado',
};

// Que se puede mandar en cada momento del partido.
const EVENTOS_EN_JUEGO = [
  ['GOAL', 'Gol'],
  ['FOUL', 'Falta'],
  ['YELLOW_CARD', 'Tarjeta amarilla'],
  ['RED_CARD', 'Tarjeta roja'],
  ['VAR_CHECK', 'Revisión VAR (gol o falta de los últimos 2 minutos)'],
  ['ADDED_TIME', 'Tiempo añadido (solo en el minuto 45 o 90)'],
];
const AYUDA = {
  GOAL: 'El gol suma apenas se manda. Se puede revisar durante 2 minutos; si nadie lo revisa, queda firme solo.',
  FOUL: 'La falta se cuenta para el equipo. Se puede revisar durante 2 minutos.',
  YELLOW_CARD: 'Las tarjetas no se revisan por VAR.',
  RED_CARD: 'Las tarjetas no se revisan por VAR.',
  VAR_CHECK: 'Mientras el VAR revisa, el juego queda parado y las apuestas suspendidas.',
  ADDED_TIME: 'Solo se puede anunciar durante el minuto 45 o el 90.',
  MATCH_CONTINUES: 'El VAR mantiene la jugada: el partido sigue.',
  ANULAR: 'El VAR anula la jugada que está en revisión.',
};

function apiBase() { return $('apiBase').value.replace(/\/$/, ''); }

function registrar(mensaje, tipo) {
  const linea = document.createElement('div');
  linea.className = tipo || '';
  linea.textContent = `[${new Date().toLocaleTimeString()}] ${mensaje}`;
  $('log').prepend(linea);
}

async function pedir(path, opciones) {
  const respuesta = await fetch(apiBase() + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opciones,
  });
  const texto = await respuesta.text();
  const cuerpo = texto ? JSON.parse(texto) : null;
  if (!respuesta.ok) {
    throw new Error(cuerpo && cuerpo.error ? cuerpo.error : `HTTP ${respuesta.status}`);
  }
  return cuerpo;
}

function textoMinuto(minuto, extra) {
  if (minuto == null) return '--';
  return extra ? `${minuto}+${extra}'` : `${minuto}'`;
}

function partidoActual() {
  return partidosConocidos.find((p) => p.match_id === partidoSeleccionado);
}

function nombreEquipo(partido, team) {
  if (team === 'home') return partido.home_team || 'Local';
  if (team === 'away') return partido.away_team || 'Visitante';
  return '';
}

function describirJugada(eventId) {
  const evento = eventosDelPartido.find((e) => e.event_id === eventId);
  const partido = partidoActual();
  if (!evento || !partido) return eventId;
  const que = evento.event_type === 'GOAL' ? 'Gol' : 'Falta';
  return `${que} de ${nombreEquipo(partido, evento.team)} al ${textoMinuto(evento.minuto, evento.minuto_extra)}`;
}

async function refrescar() {
  try {
    partidosConocidos = await pedir('/api/partidos');
    if (partidoSeleccionado) {
      eventosDelPartido = await pedir(`/api/partidos/${encodeURIComponent(partidoSeleccionado)}/eventos`);
    }
    pintarPartidos();
    pintarReloj();
    pintarFormulario();
  } catch (error) {
    $('relojEstado').textContent = 'No se pudo conectar con la API: ' + error.message;
  }
}

function pintarPartidos() {
  const contenedor = $('listaPartidos');
  contenedor.innerHTML = '';
  partidosConocidos.forEach((partido) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (partido.match_id === partidoSeleccionado ? ' activo' : '');
    if (partido.home_team && partido.away_team) {
      const enfrentamiento = document.createElement('span');
      enfrentamiento.className = 'enfrentamiento-resumen';
      enfrentamiento.append(nodoEquipo(partido.home_team), document.createTextNode(' vs '), nodoEquipo(partido.away_team));
      chip.appendChild(enfrentamiento);
    } else {
      chip.textContent = partido.match_id;
    }
    const detalle = document.createElement('small');
    detalle.textContent = partido.estado === 'EN_JUEGO'
      ? textoMinuto(partido.minuto, partido.minuto_extra) : NOMBRE_ESTADO[partido.estado];
    chip.appendChild(detalle);
    chip.onclick = () => { partidoSeleccionado = partido.match_id; estadoAnterior = null; refrescar(); };
    contenedor.appendChild(chip);
  });
}

function pintarReloj() {
  const partido = partidoActual();
  $('btnIniciarPartido').classList.toggle('oculto', !partido || partido.estado !== 'POR_JUGAR');
  $('btnSegundoTiempo').classList.toggle('oculto', !partido || partido.estado !== 'ENTRETIEMPO');
  if (!partido) {
    $('relojMinuto').textContent = '--';
    $('relojEstado').textContent = 'Seleccioná un partido';
    return;
  }
  $('relojMinuto').textContent = textoMinuto(partido.minuto, partido.minuto_extra);
  const estado = $('relojEstado');
  estado.replaceChildren();
  if (partido.home_team && partido.away_team) {
    const enfrentamiento = document.createElement('div');
    enfrentamiento.className = 'enfrentamiento-resumen';
    enfrentamiento.append(nodoEquipo(partido.home_team), document.createTextNode(' vs '), nodoEquipo(partido.away_team));
    estado.appendChild(enfrentamiento);
  } else {
    estado.append(`Partido ${partido.match_id}`);
  }
  const detalle = document.createElement('div');
  detalle.textContent = NOMBRE_ESTADO[partido.estado];
  estado.appendChild(detalle);
}

function pintarFormulario() {
  const partido = partidoActual();
  const estado = partido ? partido.estado : null;

  // Las opciones del tipo de evento solo cambian cuando cambia el estado, para no perder la seleccion.
  if (estado !== estadoAnterior) {
    estadoAnterior = estado;
    const select = $('tipoEvento');
    select.innerHTML = '';
    let opciones = [];
    if (estado === 'EN_JUEGO') opciones = EVENTOS_EN_JUEGO;
    if (estado === 'EN_REVISION') opciones = [['MATCH_CONTINUES', 'Se mantiene la jugada (MATCH_CONTINUES)'], ['ANULAR', 'Anular la jugada']];
    opciones.forEach(([valor, texto]) => {
      const opcion = document.createElement('option');
      opcion.value = valor;
      opcion.textContent = texto;
      select.appendChild(opcion);
    });
    $('equipo').options[0].textContent = partido ? nombreEquipo(partido, 'home') + ' (local)' : 'Local';
    $('equipo').options[1].textContent = partido ? nombreEquipo(partido, 'away') + ' (visitante)' : 'Visitante';
  }

  const aviso = $('avisoRevision');
  if (estado === 'EN_REVISION') {
    aviso.textContent = `El VAR está revisando: ${describirJugada(partido.revision_abierta)}. El juego está parado.`;
  } else if (estado && estado !== 'EN_JUEGO') {
    aviso.textContent = {
      POR_JUGAR: 'El partido todavía no empezó: inicialo arriba.',
      ENTRETIEMPO: 'Entretiempo: iniciá el segundo tiempo arriba para seguir.',
      FINALIZADO: 'El partido terminó.',
    }[estado];
  }
  aviso.classList.toggle('oculto', !estado || estado === 'EN_JUEGO');

  // Jugadas que todavia se pueden revisar.
  const revisar = $('jugadaARevisar');
  const elegida = revisar.value;
  revisar.innerHTML = '';
  (partido ? partido.revisables : []).forEach((id) => {
    const opcion = document.createElement('option');
    opcion.value = id;
    opcion.textContent = describirJugada(id);
    revisar.appendChild(opcion);
  });
  if (elegida) revisar.value = elegida;

  actualizarCamposSegunTipo();
}

function actualizarCamposSegunTipo() {
  const tipo = $('tipoEvento').value;
  const partido = partidoActual();
  $('campoEquipo').classList.toggle('oculto', !['GOAL', 'FOUL', 'YELLOW_CARD', 'RED_CARD'].includes(tipo));
  $('campoRevisar').classList.toggle('oculto', tipo !== 'VAR_CHECK');
  $('campoMinutosAgregados').classList.toggle('oculto', tipo !== 'ADDED_TIME');
  $('ayudaEvento').textContent = AYUDA[tipo] || '';

  let sePuede = !!partido && ['EN_JUEGO', 'EN_REVISION'].includes(partido.estado) && !!tipo;
  if (tipo === 'VAR_CHECK' && $('jugadaARevisar').options.length === 0) {
    sePuede = false;
    $('ayudaEvento').textContent = 'No hay goles ni faltas de los últimos 2 minutos para revisar.';
  }
  $('btnEnviarEvento').disabled = !sePuede;
}

$('btnCrearPartido').onclick = async () => {
  const matchId = $('nuevoMatchId').value.trim();
  if (!matchId) { registrar('Escribí un ID de partido primero', 'err'); return; }
  const local = $('equipoLocal').value;
  const visitante = $('equipoVisitante').value;
  if (!local || !visitante) {
    registrar('Seleccioná los equipos local y visitante de la Premier League', 'err');
    return;
  }
  if (local === visitante) {
    registrar('El equipo local y visitante deben ser distintos', 'err');
    return;
  }
  try {
    await pedir('/api/partidos', {
      method: 'POST',
      body: JSON.stringify({
        match_id: matchId,
        home_team: local,
        away_team: visitante,
      }),
    });
    registrar(`Partido ${matchId} creado (por jugar)`, 'ok');
    $('nuevoMatchId').value = '';
    $('equipoLocal').value = '';
    $('equipoVisitante').value = '';
    actualizarSelectoresEquipos();
    partidoSeleccionado = matchId;
    estadoAnterior = null;
    await refrescar();
  } catch (error) {
    registrar('No se pudo crear el partido: ' + error.message, 'err');
  }
};

async function accionDelReloj(ruta, mensaje) {
  if (!partidoSeleccionado) return;
  try {
    await pedir(`/api/partidos/${encodeURIComponent(partidoSeleccionado)}/${ruta}`, { method: 'POST' });
    registrar(mensaje, 'ok');
    await refrescar();
  } catch (error) {
    registrar('No se pudo: ' + error.message, 'err');
  }
}

$('btnIniciarPartido').onclick = () => accionDelReloj('iniciar', `Partido ${partidoSeleccionado} iniciado: el reloj empieza a correr`);
$('btnSegundoTiempo').onclick = () => accionDelReloj('segundo-tiempo', `Comienza el segundo tiempo de ${partidoSeleccionado}`);
$('tipoEvento').onchange = actualizarCamposSegunTipo;
$('jugadaARevisar').onchange = actualizarCamposSegunTipo;

$('btnEnviarEvento').onclick = async () => {
  const partido = partidoActual();
  if (!partido) return;
  let tipo = $('tipoEvento').value;

  const cuerpo = {};
  if (['GOAL', 'FOUL', 'YELLOW_CARD', 'RED_CARD'].includes(tipo)) cuerpo.team = $('equipo').value;
  if (tipo === 'VAR_CHECK') cuerpo.reviews_event_id = $('jugadaARevisar').value;
  if (tipo === 'ADDED_TIME') cuerpo.minutos_agregados = Number($('minutosAgregados').value);
  if (tipo === 'ANULAR') {
    // Se anula la jugada que esta en revision: gol o falta segun lo que sea.
    const enRevision = eventosDelPartido.find((e) => e.event_id === partido.revision_abierta);
    tipo = enRevision && enRevision.event_type === 'FOUL' ? 'FOUL_ANNULLED' : 'GOAL_ANNULLED';
  }
  cuerpo.event_type = tipo;

  try {
    const evento = await pedir(`/api/partidos/${encodeURIComponent(partido.match_id)}/eventos`, {
      method: 'POST',
      body: JSON.stringify(cuerpo),
    });
    registrar(`${evento.event_type} enviado en el minuto ${textoMinuto(evento.minuto, evento.minuto_extra)} (event_id=${evento.event_id})`, 'ok');
    await refrescar();
  } catch (error) {
    registrar('No se pudo enviar el evento: ' + error.message, 'err');
  }
};

refrescar();
// El reloj corre en el servidor: se consulta cada segundo para ver el minuto en vivo.
setInterval(refrescar, 1000);
</script>
