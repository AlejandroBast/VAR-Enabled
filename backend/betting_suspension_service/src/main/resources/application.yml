spring:
  application:
    name: betting-suspension-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: betting-suspension-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.varenabled.contratos
        spring.json.value.default.type: com.varenabled.contratos.EventoPartidoDto
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
